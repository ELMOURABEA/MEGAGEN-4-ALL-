# GitHub OAuth Application Configuration for MEGAGENT V2.0
# This configuration enables MEGAGENT to work as a GitHub OAuth application
# across all platforms: mobile, web, desktop (Windows, macOS, Ubuntu/Linux)

oauth:
  # OAuth Application Details
  app_name: "MEGAGENT OCTOGEN V2.0"
  description: "The Ultimate 10-in-1 AI SuperAgent - OAuth Integration"
  homepage_url: "https://github.com/ELMOURABEA/MEGAGENT"
  
  # OAuth Scopes Required
  scopes:
    - repo                    # Full control of repositories
    - workflow                # Update GitHub Actions workflows
    - write:packages          # Upload packages
    - read:packages           # Download packages
    - delete:packages         # Delete packages
    - admin:repo_hook         # Full control of repository hooks
    - admin:org_hook          # Full control of organization hooks
    - gist                    # Create gists
    - notifications           # Access notifications
    - user                    # Update user profile
    - read:user               # Read user profile
    - user:email              # Access user email
    - read:org                # Read organization data
    - write:discussion        # Write team discussions
    - read:discussion         # Read team discussions
  
  # Callback URLs for different platforms
  callback_urls:
    web: "https://megagent.app/oauth/callback"
    mobile_ios: "megagent://oauth/callback"
    mobile_android: "megagent://oauth/callback"
    desktop_windows: "http://localhost:8080/oauth/callback"
    desktop_macos: "http://localhost:8080/oauth/callback"
    desktop_linux: "http://localhost:8080/oauth/callback"
  
  # Authorization URL
  authorization_url: "https://github.com/login/oauth/authorize"
  
  # Token URL
  token_url: "https://github.com/login/oauth/access_token"
  
  # Device Flow (for CLI/terminal usage)
  device_authorization_url: "https://github.com/login/device/code"

# Platform-specific configurations
platforms:
  web:
    enabled: true
    framework: "React/Next.js"
    build_command: "npm run build:web"
    deploy_target: "Vercel/Netlify"
    port: 3000
  
  mobile:
    ios:
      enabled: true
      framework: "React Native"
      build_command: "npm run build:ios"
      min_version: "iOS 14.0+"
      bundle_id: "com.megagent.octogen"
    
    android:
      enabled: true
      framework: "React Native"
      build_command: "npm run build:android"
      min_version: "Android 8.0+ (API 26)"
      package_name: "com.megagent.octogen"
  
  desktop:
    windows:
      enabled: true
      framework: "Electron"
      build_command: "npm run build:win"
      architectures: ["x64", "arm64"]
      installer: "NSIS"
    
    macos:
      enabled: true
      framework: "Electron"
      build_command: "npm run build:mac"
      architectures: ["x64", "arm64"]
      min_version: "macOS 10.15+"
      code_signing: true
    
    linux:
      enabled: true
      framework: "Electron"
      build_command: "npm run build:linux"
      architectures: ["x64", "arm64"]
      formats: ["AppImage", "deb", "rpm", "snap"]
      distributions:
        - ubuntu
        - debian
        - fedora
        - arch
        - opensuse

# Security Configuration
security:
  state_parameter: true           # CSRF protection
  pkce: true                      # Proof Key for Code Exchange
  token_storage: "encrypted"      # Encrypt tokens at rest
  token_expiry: 3600              # 1 hour
  refresh_token: true             # Support token refresh
  
# API Configuration
api:
  base_url: "https://api.github.com"
  version: "2022-11-28"
  user_agent: "MEGAGENT-OCTOGEN-v2.0"
  rate_limit_buffer: 100          # Keep 100 requests as buffer
  
# Features enabled for OAuth users
features:
  auto_connect: true               # Self-connect to GitHub
  auto_update: true                # Auto-update from GitHub
  repo_access: true                # Access all repositories
  workflow_execution: true         # Execute GitHub Actions
  issue_management: true           # Create/update issues
  pr_management: true              # Create/update PRs
  code_analysis: true              # Analyze code in repos
  deployment: true                 # Deploy applications
  octogen_full_access: true        # All OCTOGEN capabilities
